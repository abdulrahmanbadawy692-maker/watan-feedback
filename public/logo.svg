<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield / icon -->
  <g transform="translate(15, 10)">
    <path d="M50 5 L90 25 L90 60 Q90 90 50 105 Q10 90 10 60 L10 25 Z" fill="url(#logoGrad)" opacity="0.9"/>
    <text x="50" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">W</text>
    <path d="M30 75 L50 85 L70 55" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <!-- Company name -->
  <text x="120" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Watan First</text>
  <text x="120" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400" fill="#4da6ff">Digital</text>
</svg>
